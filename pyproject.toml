[project]
name = "hyprcu"
version = "0.1.0"
description = "Computer use for Hyprland: an MCP server giving AI agents native Wayland hands (no uinput, no root, no portals)"
readme = "README.md"
license = "MIT"
authors = [{ name = "Manish Biswal" }]
requires-python = ">=3.11"
keywords = ["hyprland", "wayland", "mcp", "computer-use", "claude", "agent", "accessibility"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "mcp>=2.0",
    "pywayland>=0.4.17",
    "pillow>=10",
]

[project.optional-dependencies]
a11y = ["pygobject>=3.46"]

[project.urls]
Homepage = "https://github.com/iamanishx/hyprcu"
Issues = "https://github.com/iamanishx/hyprcu/issues"

[project.scripts]
hyprcu = "hyprcu.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hyprcu"]
